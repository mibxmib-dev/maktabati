<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>home movie</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" href="assets/favicon-v2.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-v2.png">
<meta name="theme-color" content="#120A0A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Pacifico&family=Tilt+Neon&display=swap">
<style>
:root{
  /* عالم بصري واحد داكن: شريط علوي، تبويبات للأقسام، شبكة مجلدات ثم قائمة تشغيل */
  /* هوية home movie: ستارة سينما داكنة، كريمي دافئ كضوء الشاشة */
  --ground:#120A0A; --surface:#1C1312; --raised:#291C1A; --line:#3B2A27;
  --text:#F6EEE3; --muted:#BBA99B; --accent:#F4C27A; --on-accent:#2A1606; --warn:#F3A58F;
  --script:'Pacifico',cursive;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6}
button,input{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* شاشة الافتتاح */
#signin{position:relative;min-height:100%;background:#0E0606;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;padding:24px 0 32px}
.scene{position:relative;flex-shrink:0;width:clamp(520px,min(100vw,calc((100vh - 200px) * 1.7917)),1376px);aspect-ratio:1376/768;container-type:inline-size;overflow:hidden;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}

.scene>*{position:absolute}
.bgimg{inset:0}
.bgimg img{width:100%;height:100%;display:block}
.title img{width:100%;display:block}
.dim{inset:0;background:radial-gradient(ellipse 30% 40% at 49.5% 56%,rgba(8,3,3,.55),rgba(5,2,2,.93));transition:opacity 2.2s ease}
.lit .dim{opacity:0}
.tvlight{left:22%;top:22%;width:56%;height:70%;background:radial-gradient(closest-side,rgba(255,196,110,.30),rgba(255,160,80,.08) 60%,transparent);mix-blend-mode:screen;opacity:0;pointer-events:none}
.neon-on .tvlight{opacity:1;animation:buzz 5s infinite}
.title{left:24.71%;top:12.37%;width:51.6%;clip-path:inset(0 100% 0 0);filter:drop-shadow(0 0 0 rgba(255,190,110,0))}
.lit .title{transition:clip-path 1.9s cubic-bezier(.6,.05,.3,1) .5s,filter 1.2s ease 2.2s;clip-path:inset(0 0 0 0);filter:drop-shadow(0 0 1.4cqw rgba(255,190,110,.45))}
.tv{left:38.15%;top:40.23%;width:21.95%;height:30.99%;background:#040404;border-radius:9%/12%;overflow:hidden;container-type:inline-size;display:flex;align-items:center;justify-content:center}
.tv::before{content:"";position:absolute;inset:0;background:#fff;transform:scale(0,.004);opacity:0;z-index:3}
.tv.boot::before{animation:crt .55s ease-out forwards}
.tv canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s}
.tv.static canvas{opacity:.85}
.neon{position:relative;z-index:2;font-family:'Tilt Neon',sans-serif;direction:ltr;text-align:center;font-size:23cqw;line-height:1.02;color:#FFD98C;opacity:0;text-shadow:0 0 1cqw #fff3c4,0 0 3cqw #ffbf55,0 0 7cqw #ff9d2e,0 0 14cqw #ff8a1e}
.neon-on .neon{animation:flick 1.6s steps(1) forwards,buzz 5s 1.6s infinite}
.tv::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(rgba(255,255,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.65))}
.power{position:relative;z-index:5;background:none;border:0;color:#CDBBA9;font-family:var(--font);font-size:max(12px,7.5cqw);display:flex;flex-direction:column;align-items:center;gap:4cqw;min-height:44px;padding:8px;animation:breathe 2.4s ease-in-out infinite}
.power svg{width:max(22px,17cqw);height:max(22px,17cqw)}
.started .power{display:none}
.chip{position:absolute;top:16px;z-index:6;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(10,4,4,.55);color:#EADCCB;font-family:var(--font);font-size:13px;display:none;align-items:center;gap:6px;backdrop-filter:blur(4px)}
#signin.started .chip{display:inline-flex}
#btnSkip{left:16px}
#signin.done #btnSkip{display:none}
.login{width:min(440px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;margin-top:4px;opacity:0;transform:translateY(14px);visibility:hidden;transition:opacity .9s ease,transform .9s ease,visibility 0s .9s}
.done .login,#signin.done .login{opacity:1;transform:none;visibility:visible;transition:opacity .9s ease,transform .9s ease}
.login h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.login .lead{margin:0;text-align:center;font-size:16px;color:var(--text)}
.login .note{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.btn.google{min-height:52px;font-size:16px}
@keyframes crt{0%{opacity:1;transform:scale(0,.004)}35%{opacity:1;transform:scale(1,.004)}70%{opacity:.9;transform:scale(1,1)}100%{opacity:0;transform:scale(1,1)}}
@keyframes flick{0%{opacity:0}8%{opacity:1}12%{opacity:.1}20%{opacity:.9}24%{opacity:.2}38%{opacity:1}42%{opacity:.35}50%,100%{opacity:1}}
@keyframes buzz{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.82}49%{opacity:1}86%{opacity:.93}87%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.neon-on .neon{animation:none;opacity:1}.neon-on .tvlight{animation:none}.power{animation:none;opacity:1}.lit .title{transition:clip-path .01s,filter .01s}}

/* الجوال بالطول: صورة طولية بمواضع خاصة، والريموت يبقى فوق الشاشة */
@media (max-aspect-ratio:1/1){
  #signin{justify-content:flex-start;padding-top:0}
  .scene{width:min(100vw,calc(100vh * .5581));width:min(100vw,calc(100svh * .5581));aspect-ratio:768/1376;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
  .title{left:18.23%;top:31.98%;width:65.1%}
  .tv{left:35.29%;top:46.29%;width:27.34%;height:11.99%;border-radius:6%/9%;clip-path:polygon(0 0,100% 0,100% 100%,97.6% 100%,97.6% 88.5%,95.8% 85.2%,15.4% 85.2%,13.6% 88.5%,13.6% 100%,0 100%)}
  .neon{font-size:21cqw;margin-top:-6%}
  .tvlight{left:8%;top:34%;width:84%;height:34%}
  #signin{--sw:min(100vw,calc(100vh * .5581));--sw:min(100vw,calc(100svh * .5581));padding-bottom:0}
  /* المقاسات تتبع عرض المشهد، فتبقى متناسبة حتى لو فتح المتصفح بوضع سطح المكتب */
  .login{position:absolute;z-index:6;left:0;right:0;margin:0 auto;width:calc(var(--sw) * .88);top:calc(var(--sw) * 1.7917 * .045);font-size:max(15px,calc(var(--sw) * .04));gap:.8em;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .login .lead{font-size:1em;line-height:1.55}
  .login .note{font-size:.8em}
  .login .btn{font-size:1em;min-height:3.3em;border-radius:.8em}
  .login .msg{font-size:.9em}
  #signin .chip{font-size:max(13px,calc(var(--sw) * .034));min-height:max(44px,calc(var(--sw) * .11));padding:0 1.1em;border-radius:2em}
}

/* الأزرار والنماذج */
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--text);padding:0 18px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.small{min-height:44px;font-size:14px}
.msg{font-size:14px;color:var(--warn);background:#2A1F1C;border:1px solid #4A322C;border-radius:10px;padding:10px 12px}
details{border-top:1px solid var(--line);padding-top:12px}
.brand{display:inline-flex;align-items:center}
.top h1 .brand{font-family:var(--script);font-weight:400;font-size:24px;color:var(--accent);line-height:1}
summary{cursor:pointer;font-size:14px;color:var(--muted);min-height:32px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:13px;color:var(--muted)}
.field input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--ground);color:var(--text);padding:0 12px;direction:ltr;text-align:left}

/* المكتبة */
header.top{position:sticky;top:0;background:var(--ground);border-bottom:1px solid var(--line);z-index:5}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.top h1{margin:0;font-size:22px}
.top h1 button{background:none;border:0;color:var(--text);font:inherit;font-weight:700;min-height:44px;padding:0}
.search{flex:1 1 220px;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 18px}
.search::placeholder{color:var(--muted)}
.who{font-size:12px;color:var(--muted);direction:ltr;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;color:var(--on-accent);background:var(--accent);border-radius:20px;padding:2px 10px;font-weight:700}
.status{font-size:13px;color:var(--muted);padding:10px 0 0}
main{padding-bottom:48px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
.rowhead h2{margin:0;font-size:18px;font-weight:700}
.rowhead button{background:none;border:0;color:var(--muted);min-height:44px;font-size:14px;text-decoration:underline}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.card{flex:0 0 132px;width:132px;scroll-snap-align:start;background:none;border:0;color:var(--text);padding:0;display:flex;flex-direction:column;gap:6px;text-align:right}
.tile{width:132px;height:190px;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow:hidden;display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .tile,.card:focus-visible .tile{border-color:var(--accent)}
.card .name{font-size:14px;font-weight:500;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:10px 0 0;font-size:14px;color:var(--muted)}
.crumbs button{background:none;border:0;color:var(--muted);min-height:44px;padding:0 6px;text-decoration:underline}
.crumbs .here{color:var(--text);font-weight:700;padding:0 6px}
h3{font-size:15px;margin:18px 0 10px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px 12px}
.folder{min-height:96px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:right;gap:10px}
.folder:hover,.video:hover{background:var(--raised)}
.folder span{font-weight:500;overflow-wrap:anywhere}
.folder svg{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.video{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:right;width:100%}
.video .play{width:40px;height:40px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vthumb{position:relative;width:96px;height:54px;border-radius:8px;background:var(--raised);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play.mini{position:relative;width:28px;height:28px;border-radius:14px}
.video .txt{flex:1;display:flex;flex-direction:column;min-width:0}
.video .name{overflow-wrap:anywhere;font-weight:500}
.video .where{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.video .dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.state{color:var(--muted);padding:28px 0;text-align:center}

/* المشغّل */
#player{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ground);border-bottom:1px solid var(--line)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{background:var(--raised)}
#pFav[aria-pressed="true"]{color:var(--accent)}
.pbar .ptitle{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700;line-height:1.35}
.pbar .ptitle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pseries{font-size:12px;color:var(--accent);font-weight:500}
.pseries:empty{display:none}
.pbar a{color:var(--muted);font-size:13px;min-height:44px;display:inline-flex;align-items:center;padding:0 6px;white-space:nowrap}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:#000}
.stage iframe{width:100%;height:100%;border:0}
.stage .demo{color:var(--muted);text-align:center;padding:24px;max-width:420px}
.pctl{display:flex;gap:8px;justify-content:center;padding:10px 12px;background:var(--ground);border-top:1px solid var(--line)}
.pctl .btn{flex:0 1 auto}
.pctl .primary{flex:1 1 auto;max-width:280px}
.pstrip{display:flex;gap:10px;overflow-x:auto;padding:0 12px 12px;background:var(--ground);scroll-snap-type:x proximity}
.pep{flex:0 0 132px;display:flex;flex-direction:column;gap:6px;background:none;border:0;color:var(--muted);padding:0;text-align:right;scroll-snap-align:start}
.pep .vthumb{width:132px;height:74px;border:2px solid transparent}
.pep[aria-current] .vthumb{border-color:var(--accent)}
.pep[aria-current]{color:var(--text)}
.pseason{flex:0 0 auto;align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;color:var(--accent);padding:0 2px;border-inline-start:1px solid var(--line)}
.pepname{font-size:12px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seenmark{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
@media (max-height:520px){.pstrip{display:none}.pctl{padding:6px 12px}}

/* شريط القنوات */
.chanhead{font-size:20px;margin:18px 0 10px}
.channels{direction:ltr;overflow-x:auto;padding:4px 0 8px;margin:0 -20px;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:16px;width:max-content;padding:0 20px;direction:ltr}
.track .chan{direction:rtl}
.channels{overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.channels.dragging{cursor:grabbing}
.track{will-change:transform}
.chan img{-webkit-user-drag:none;pointer-events:none}
.chan{flex:0 0 160px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--text)}
.chanlogo{width:160px;height:100px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.chanlogo:not(:has(img)){background:var(--raised)}
.chanlogo img{width:100%;height:100%;object-fit:cover;display:block}
.chan:hover .chanlogo,.chan:focus-visible .chanlogo{outline:2px solid var(--accent);outline-offset:2px}
.chaninit{font-size:44px;font-weight:700;color:var(--accent)}
.channame{font-size:15px;font-weight:600;text-align:center;line-height:1.35;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المشغّل: الاستكمال */
.stage{position:relative}
.stage video{width:100%;height:100%;background:#000;display:block}
.resume{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(10,6,6,.82);text-align:center}
.rtitle{margin:0;font-size:18px;font-weight:700}
.rsub{margin:0;color:var(--muted);font-size:14px}
.racts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.progline{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.22);z-index:2}
.progline span{position:absolute;top:0;bottom:0;right:0;background:var(--accent)}
.progline.big{position:relative;width:min(320px,80%);height:6px;border-radius:3px;overflow:hidden}
.pnote{position:absolute;top:10px;left:10px;right:10px;z-index:3;background:rgba(18,10,10,.9);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text)}

/* يوتيوب */
.creators{gap:14px}
.creator{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--text)}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--raised);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.big{width:72px;height:72px;flex-shrink:0}
.creator:hover .avatar,.creator:focus-visible .avatar{border-color:var(--accent)}
.cname{font-size:13px;font-weight:600;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:16px 10px}
.ythead{display:flex;align-items:center;gap:14px;margin-top:10px}
.ythead .ptitle2{margin:0}
.cologo.big{width:72px;height:72px}
.vcard{flex:0 0 220px;width:220px;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;color:var(--text);text-align:right}
.vcard.wide{width:auto}
.vthumb.big{width:100%;height:auto;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line)}
.vcard:hover .vthumb,.vcard:focus-visible .vthumb{border-color:var(--accent)}
.vdur{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:1px 6px;border-radius:6px;direction:ltr;font-variant-numeric:tabular-nums}
.vname{font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{font-size:12px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px 14px}
@media (max-width:560px){.vgrid{grid-template-columns:1fr}}
.state.small{padding:8px 0 16px;text-align:right;font-size:14px}

/* التصفية، الشركات، صفحة العمل */
.fchips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}
.fchip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--text);white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--ground)}
.ptitle2{font-size:22px;margin:16px 0 4px}
.company{margin-top:26px;padding-top:6px;border-top:1px solid var(--line)}
.cohead{display:flex;align-items:center}
.coname{display:inline-flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);font-size:22px;font-weight:700;min-height:48px;padding:0}
.coname svg{color:var(--muted)}
.cologo{width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--raised);border:1px solid var(--line);flex-shrink:0}
.cologo img{width:100%;height:100%;object-fit:contain;padding:4px;display:block}
.rowhead.sub{margin:12px 0 8px}
.rowhead h3{margin:0;font-size:15px;color:var(--muted);font-weight:500}
.tile{position:relative}
.favdot{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:13px;background:rgba(18,10,10,.75);color:var(--accent);display:flex;align-items:center;justify-content:center}
.play.over{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:17px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.thero{position:relative;overflow:hidden;border-radius:18px;margin-top:14px;border:1px solid var(--line);background:linear-gradient(135deg,#2B1A18,#160E0D)}
.tbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(22px) saturate(1.2);transform:scale(1.2);opacity:.5}
.thero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(18,10,10,.96) 15%,rgba(18,10,10,.55) 70%,rgba(18,10,10,.3))}
.tin{position:relative;z-index:1;display:flex;gap:20px;align-items:flex-end;padding:20px}
.tposter{width:150px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--raised);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.tposter img{width:100%;height:100%;object-fit:cover;display:block}
.tinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.tinfo h2{margin:0;font-size:clamp(24px,5vw,36px);line-height:1.25;text-wrap:balance}
.eyebrow{align-self:flex-start;background:none;border:0;padding:0;color:var(--accent);font-size:14px;font-weight:500;min-height:32px;text-decoration:underline;text-underline-offset:3px}
.tmeta{margin:0;color:var(--muted);font-size:14px}
.tacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.tacts .btn{gap:8px}
.favbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
@media (max-width:560px){.tin{flex-direction:column;align-items:flex-start}.tposter{width:120px}.tacts .btn{flex:1 1 auto}}
.seasons{padding-top:18px}
.stat{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-top:2px}
.stat.seen{color:var(--muted)}
.stat.now{color:var(--accent)}
.video.watched .name{color:var(--muted)}
.video.current{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.folder,.video,.tab{transition:background .15s}}

<body>

<section id="signin">
    <button class="chip" id="btnSkip" type="button">تخطي</button>
  <div class="scene" id="scene">
    <picture class="bgimg"><source media="(max-aspect-ratio: 1/1)" srcset="assets/scene-p.webp"><img src="assets/scene.webp" alt=""></picture>
    <div class="dim"></div>
    <div class="tvlight"></div>
    <picture class="title"><source media="(max-aspect-ratio: 1/1)" srcset="assets/title-p.webp"><img src="assets/title.webp" alt=""></picture>
    <div class="tv" id="tv">
      <canvas id="noise" width="160" height="120"></canvas>
      <div class="neon" aria-hidden="true">90's<br>TV</div>
    </div>
  </div>
  <div class="login">
    <h1>home movie</h1>
    <p class="lead">أفلامك ومسلسلاتك في مكان واحد، تُعرض مباشرة من مجلدك.</p>
    <button class="btn primary google" id="btnSignin" type="button">الدخول بحساب Google</button>
    <button class="btn" id="btnDemo" type="button">عرض تجريبي ببيانات وهمية</button>
    <div class="msg" id="signinMsg" hidden></div>
    <p class="note">ينقلك الزر لصفحة Google الرسمية. الصفحة تقرأ ملفاتك فقط ولا تعدّل شيئاً.</p>
    <details id="setup">
      <summary>إعداد الربط (مرة واحدة)</summary>
      <div class="field"><label for="inClient">معرّف العميل OAuth Client ID</label><input id="inClient" autocomplete="off" placeholder="xxxxxxxx.apps.googleusercontent.com"></div>
      <div class="field"><label for="inFolder">رابط المجلد الرئيسي في Drive</label><input id="inFolder" autocomplete="off" placeholder="https://drive.google.com/drive/folders/..."></div>
      <div class="field"><button class="btn small" id="btnSave" type="button">حفظ الإعداد</button></div>
    </details>
  </div>
</section>

<div id="library" hidden>
  <header class="top"><div class="wrap">
    <h1><button id="btnHome" type="button" aria-label="الرئيسية"><span class="brand">home movie</span></button></h1>
    <span class="badge" id="demoBadge" hidden>عرض تجريبي</span>
    <span class="who" id="who" hidden></span>
    <input class="search" id="q" type="search" autocomplete="off" placeholder="ابحث عن فيلم أو مسلسل أو حلقة" aria-label="بحث في المكتبة">
    <button class="btn small" id="btnRefresh" type="button">تحديث</button>
    <button class="btn small" id="btnSignout" type="button">تسجيل الخروج</button>
  </div></header>
  <main class="wrap">
    <div class="status" id="status" hidden></div>
    <nav class="crumbs" id="crumbs" aria-label="المسار" hidden></nav>
    <div id="content"></div>
  </main>
</div>

<div id="player" hidden>
  <div class="pbar">
    <button class="iconbtn" id="btnClose" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <div class="ptitle"><span class="pseries" id="pseries"></span><span id="ptitle"></span></div>
    <button class="iconbtn" id="pFav" type="button" aria-pressed="false" aria-label="أضف للمفضلة"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.2C1 8 3 4.5 6.6 4.5c2.1 0 3.6 1.1 5.4 3.1 1.8-2 3.3-3.1 5.4-3.1C21 4.5 23 8 21.6 11.3 19.5 15.9 12 20.5 12 20.5z"></path></svg></button>
    <a id="openDrive" href="#" target="_blank" rel="noopener">فتح في Drive</a>
  </div>
  <div class="stage" id="stage"></div>
  <div class="pctl">
    <button class="btn small" id="btnPrev" type="button">السابق</button>
    <button class="btn small primary" id="btnDone" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"></path></svg><span>شاهدتها · التالي</span></button>
    <button class="btn small" id="btnNext" type="button">التالي</button>
  </div>
  <div class="pstrip" id="pstrip" aria-label="الحلقات"></div>
</div>

<script>
/* ===== الإعداد: يمكن كتابة القيم هنا مباشرة بدل إدخالها من الصفحة ===== */
var CONFIG = { clientId: '104180979164-5kf8e7d44h0kkdd0empi5jt3p001pqt2.apps.googleusercontent.com', folder: '1myjZwEinh1P9D7Lc276qx5QfbF7N_96Y' };
var SCOPE = 'https://www.googleapis.com/auth/drive.readonly';

var $ = function (id) { return document.getElementById(id); };
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function folderId(s) { s = (s || '').trim(); var m = s.match(/folders\/([\w-]+)/) || s.match(/[?&]id=([\w-]+)/); return m ? m[1] : s; }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  if (fill) s.setAttribute('fill', 'currentColor'); else { s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linejoin', 'round'); }
  var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', path); s.appendChild(p); return s;
}

function clean(n) { return n.replace(/\.[a-z0-9]{2,4}$/i, ''); }
/* قراءة رقم الموسم والحلقة من اسم الملف، مثل: صائدو الأشباح S03E01.480p.mkv */
function epInfo(name) {
  var b = clean(name), m = b.match(/S(\d{1,2})[\s._-]*E(\d{1,3})/i) || b.match(/(?:^|[\s._-])(\d{1,2})x(\d{1,3})(?:$|[\s._-])/i);
  if (m) return { s: +m[1], e: +m[2] };

  return m ? { s: 0, e: +m[1] } : null;
}
/* تنظيف الاسم من علامات الجودة والترميز */
function tidy(t) {
  return t.replace(/[._]+/g, ' ')
    .replace(/\b(\d{3,4}p|4k|uhd|web[\s-]?dl|webrip|hdtv|hdrip|bluray|blu[\s-]?ray|brrip|dvdrip|x26[45]|h\s?26[45]|hevc|aac\d?(\s?\d)?|ac3|ddp?\d?(\s?\d)?|10bit|dubbed|subbed)\b/gi, '')
    .replace(/[\[\(]\s*[\]\)]/g, '').replace(/\s*-\s*$/, '').replace(/\s{2,}/g, ' ').trim();
}
function norm(t) { return (t || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[._\-]+/g, ' ').trim(); }
function hue(t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return TILE[h % TILE.length]; }

var clientId = CONFIG.clientId || store('mk_client') || '';
var rootId = folderId(CONFIG.folder || store('mk_folder') || '');
$('inClient').value = clientId; $('inFolder').value = CONFIG.folder || store('mk_folder') || '';
if (CONFIG.clientId && CONFIG.folder) { $('setup').hidden = true; $('btnDemo').hidden = onSite(); }

var token = null, demo = false, tokenClient = null;
var nodes = {}, rootKey = '', crawlGen = 0, crawling = false, fatal = '';
var view = 'home', cur = '', query = '';
var queue = [], qIndex = 0, timer = null;

function showMsg(t) { var m = $('signinMsg'); m.textContent = t; m.hidden = !t; if (t) { $('signin').classList.add('done'); } }
function node(id, name, folder, parent, dur) { return nodes[id] = { id: id, name: name, folder: folder, parent: parent, dur: dur || 0, kids: folder ? null : undefined }; }

/* ===== بيانات العرض التجريبي ===== */
function demoTree() {
  var n = 0;
  function dir(name, parent) { var d = node('demo-' + (++n), name, true, parent); d.kids = []; d.images = []; nodes[parent].kids.push(d.id); return d.id; }
  function vid(name, parent, mins) { var v = node('demo-' + (++n), name + '.mp4', false, parent, mins * 60000); v.thumb = frame(n); nodes[parent].kids.push(v.id); }
  function pic(k) {
    var c = TILE[k % TILE.length];
    return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 190"><rect width="132" height="190" fill="' + c + '"/><circle cx="' + (30 + k * 17 % 70) + '" cy="70" r="46" fill="#F4C27A" opacity=".55"/><rect y="120" width="132" height="70" fill="#120A0A" opacity=".55"/><text x="66" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F6EEE3">غلاف تجريبي</text></svg>');
  }
  function frame(k) {
    var c = TILE[(k * 3) % TILE.length];
    return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90"><rect width="160" height="90" fill="' + c + '"/><rect x="' + (k * 23 % 100) + '" y="20" width="60" height="50" rx="8" fill="#F4C27A" opacity=".35"/></svg>');
  }
  function cover(id, k) { nodes[id].images = [{ id: 'img-' + id, name: 'cover.jpg', thumb: pic(k) }]; }
  [['استوديو الشمس', ['مسلسل البيت الكبير', 'مسلسل رحلة الصيف', 'مسلسل الأصدقاء'], ['فيلم الطريق', 'فيلم الحارس', 'فيلم النجمة']],
   ['شركة النجوم', ['Demo Series A', 'Demo Series B'], ['Demo Movie One', 'Demo Movie Two']]].forEach(function (co, ci) {
    var c = dir(co[0], rootKey), ser = dir('مسلسلات', c), mov = dir('أفلام', c);
    co[1].forEach(function (name, k) {
      var x = dir(name, ser); if (k !== 2) cover(x, ci * 5 + k);
      for (var s = 1; s <= 1 + (k + ci) % 3; s++) { var ss = dir(ci ? 'Season ' + s : 'الموسم ' + s, x); for (var e = 1; e <= 6; e++) vid(ci ? 'Episode ' + e : 'الحلقة ' + e, ss, 42); }
    });
    co[2].forEach(function (name, k) { var x = dir(name, mov); if (k !== 1) cover(x, ci * 5 + k + 3); vid(name, x, 98 + k * 9); });
  });
  /* يوتيوب: قنوات صنّاع محتوى بأقسام فلوقات وتحديات */
  var yt = dir('YouTube', rootKey); cover(yt, 2);
  [['قناة الصقر', 4], ['قناة القوة', 7]].forEach(function (cr, ci) {
    var c = dir(cr[0], yt); cover(c, cr[1]);
    var vl = dir('فلوقات', c), ch = dir('تحديات', c);
    for (var e = 1; e <= 4; e++) { vid('فلوق ' + e + ' - ' + cr[0], vl, 12 + e); nodes['demo-' + n].created = Date.now() - (ci * 10 + e) * 864e5; }
    for (e = 1; e <= 3; e++) { vid('تحدي ' + e + ' - ' + cr[0], ch, 18 + e); nodes['demo-' + n].created = Date.now() - (ci * 7 + e * 2) * 864e5; }
  });
  /* شركة بدون مجلدي مسلسلات/أفلام: النوع يُعرف تلقائياً */
  var w = dir('شركة الواحة', rootKey); cover(w, 9);
  var s1 = dir('مسلسل الواحة', w); cover(s1, 11); var q = dir('الموسم 1', s1); for (var e = 1; e <= 5; e++) vid('الحلقة ' + e, q, 40);
  var f1 = dir('فيلم الواحة', w); cover(f1, 12); vid('فيلم الواحة', f1, 110);
}

/* ===== قراءة Drive وفهرسة المكتبة ===== */
function loadKids(id) {
  var nd = nodes[id];
  if (nd.kids) return Promise.resolve(nd.kids);
  if (nd.loading) return nd.loading;
  var ids = [], imgs = [];
  function page(tok) {
    var q = "'" + id + "' in parents and trashed = false and (mimeType = '" + FOLDER_MIME + "' or mimeType contains 'video/' or mimeType contains 'image/')";
    var url = 'https://www.googleapis.com/drive/v3/files?pageSize=200&orderBy=folder,name_natural' +
      '&fields=' + encodeURIComponent('nextPageToken,files(id,name,mimeType,thumbnailLink,createdTime,videoMediaMetadata(durationMillis))') +
      '&supportsAllDrives=true&includeItemsFromAllDrives=true&q=' + encodeURIComponent(q) + (tok ? '&pageToken=' + encodeURIComponent(tok) : '');
    return fetch(url, { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
      if (r.status === 401) { sset('mk_token', null); throw new Error('انتهت الجلسة. اضغط «تسجيل الخروج» ثم سجّل الدخول من جديد.'); }
      if (r.status === 404) throw new Error('لم أجد المجلد. تأكد من رابط المجلد وأنه متاح للحساب الذي سجّلت به.');
      if (!r.ok) throw new Error('تعذّرت قراءة المجلد من Drive (رمز ' + r.status + ').');
      return r.json();
    }).then(function (d) {
      (d.files || []).forEach(function (f) {
        if (f.mimeType.indexOf('image/') === 0) { imgs.push({ id: f.id, name: f.name, thumb: f.thumbnailLink || '' }); return; }
        var nn = node(f.id, f.name, f.mimeType === FOLDER_MIME, id, f.videoMediaMetadata ? Number(f.videoMediaMetadata.durationMillis) : 0);
        if (f.thumbnailLink && f.mimeType !== FOLDER_MIME) nn.thumb = f.thumbnailLink;
        nn.created = Date.parse(f.createdTime) || 0;
        ids.push(f.id);
      });
      return d.nextPageToken ? page(d.nextPageToken) : ids;
    });
  }
  nd.loading = page().then(function (a) { nd.kids = a; nd.images = imgs; nd.loading = null; return a; }, function (e) { nd.loading = null; throw e; });
  return nd.loading;
}
/* يتأكد أن الحساب الذي دخلت به يرى المجلد الرئيسي، ويعرض بريده في الأعلى */
function checkAccount() {
  var H = { headers: { Authorization: 'Bearer ' + token } };
  fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)', H).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { var e = d && d.user && d.user.emailAddress; if (e) { $('who').textContent = e; $('who').hidden = false; } }).catch(function () {});
  fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(rootId) + '?fields=id&supportsAllDrives=true', H).then(function (r) {
    if (r.status === 404 || r.status === 403) { fatal = 'هذا الحساب' + ($('who').textContent ? ' (' + $('who').textContent + ')' : '') + ' لا يرى مجلد المكتبة. اضغط «تسجيل الخروج» ثم ادخل بحساب المكتبة، أو شارك المجلد مع هذا الحساب.'; schedule(); }
  }).catch(function () {});
}
function crawl() {
  var gen = ++crawlGen, q = [rootKey], active = 0; crawling = true; fatal = '';
  checkAccount();
  function next() {
    if (gen !== crawlGen) return;
    while (active < 4 && q.length) (function (id) {
      active++;
      loadKids(id).then(function (k) { k.forEach(function (c) { if (nodes[c].folder) q.push(c); }); })
        .catch(function (e) { if (id === rootKey) fatal = e.message; else nodes[id].kids = []; })
        .then(function () { active--; schedule(); next(); });
    })(q.shift());

  }

function schedule() { clearTimeout(timer); timer = setTimeout(render, 120); }

/* ===== مساعدات ===== */
function kids(id) { return (nodes[id] && nodes[id].kids || []).map(function (k) { return nodes[k]; }); }
function trail(id) { var a = [], n = nodes[id]; while (n && n.id !== rootKey) { a.unshift(n); n = nodes[n.parent]; } return a; }
function where(n) { return trail(n.parent).map(function (x) { return x.name; }).join(' › '); }
function summary(n) {
  if (!n.folder) return fmt(n.dur);
  if (!n.kids) return '';
  if (isTitle(n)) { var g = groups(n), e = allEpisodes(n).length; return titleKind(n) === 'movie' ? (e === 1 ? fmt(allEpisodes(n)[0].dur) : e + ' فيديو') : (g.length > 1 ? seas_(g.length) + ' · ' : '') + eps_(e); }
  var v = 0, f = 0; kids(n.id).forEach(function (k) { if (k.folder) f++; else v++; });

}

function eps_(n) { return n === 1 ? 'حلقة واحدة' : n === 2 ? 'حلقتان' : n <= 10 ? n + ' حلقات' : n + ' حلقة'; }
function seas_(n) { return n === 2 ? 'موسمان' : n <= 10 ? n + ' مواسم' : n + ' موسماً'; }
/* الاسم المعروض: داخل مسلسل «الحلقة 1»، وغير ذلك اسم نظيف */
function disp(v) {
  if (v.folder) return v.name;
  var t = titleOf(v), i = epInfo(v.name);
  if (t !== v && i) return 'الحلقة ' + i.e;
  /* حلقة بلا رقم في اسمها: نرقّمها حسب ترتيبها في موسمها */
  if (t !== v && titleKind(t) === 'series') { var g = groups(t).filter(function (x) { return x.eps.indexOf(v) >= 0; })[0]; if (g) return 'الحلقة ' + (g.eps.indexOf(v) + 1); }
  return tidy(clean(v.name)) || clean(v.name);
}
function dispSeason(v) {
  var t = titleOf(v);
  if (t === v || !t.folder) return disp(v);
  var gs = groups(t);
  if (gs.length < 2) return disp(v);
  var i = epInfo(v.name);
  if (i && i.s) return 'الموسم ' + i.s + ' · الحلقة ' + i.e;
  var g = gs.filter(function (x) { return x.eps.indexOf(v) >= 0; })[0];
  return (g ? g.name + ' · ' : '') + disp(v);
}
function dispLong(v) {
  var i = epInfo(v.name), t = titleOf(v);
  if (t !== v && i) return (i.s ? 'الموسم ' + i.s + ' · ' : '') + 'الحلقة ' + i.e;
  if (t !== v && titleKind(t) === 'series') { var gs = groups(t), g = gs.filter(function (x) { return x.eps.indexOf(v) >= 0; })[0]; if (g) return (gs.length > 1 ? g.name + ' · ' : '') + disp(v); }
  return disp(v);

$('btnDemo').onclick = function () { Intro.stop(); demo = true; token = null; openLibrary(); };
