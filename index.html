<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>home movie</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" href="assets/favicon-v2.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-v2.png">
<meta name="theme-color" content="#120A0A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Pacifico&family=Tilt+Neon&display=swap">
<style>
:root{
  /* عالم بصري واحد داكن: شريط علوي، تبويبات للأقسام، شبكة مجلدات ثم قائمة تشغيل */
  /* هوية home movie: ستارة سينما داكنة، كريمي دافئ كضوء الشاشة */
  --ground:#120A0A; --surface:#1C1312; --raised:#291C1A; --line:#3B2A27;
  --text:#F6EEE3; --muted:#BBA99B; --accent:#F4C27A; --on-accent:#2A1606; --warn:#F3A58F;
  --script:'Pacifico',cursive;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden;overflow-x:clip}
body.playing{overflow:hidden}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6}
button,input{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* شاشة الافتتاح */
/* الدخول في التلفزيون بعد تسجيل الدخول */
#signin.zooming .login,#signin.zooming #btnSkip{opacity:0!important;transition:opacity .3s ease;pointer-events:none}
#signin.zooming .scene{transition:transform 2.4s cubic-bezier(.75,0,.3,1);will-change:transform;-webkit-mask-image:none;mask-image:none}
#signin.zoomin .neon{animation:none;opacity:1;transition:text-shadow 1s ease;text-shadow:0 0 2cqw #fff3c4,0 0 6cqw #ffbf55,0 0 14cqw #ff9d2e,0 0 26cqw #ff8a1e}
/* إحساس الفلاش باك: تموّج وتوهج ثم وميض أبيض */
#signin.zoomin .scene{animation:warp 2.4s ease-in forwards}
@keyframes warp{0%{filter:none}40%{filter:saturate(1.15) brightness(.95)}75%{filter:blur(1.5px) saturate(1.3) brightness(.6)}100%{filter:blur(5px) saturate(1.2) brightness(.15)}}
#signin::after{content:"";position:fixed;inset:0;background:var(--ground);opacity:0;pointer-events:none;z-index:50;transition:opacity .6s ease}
#signin.zoomout::after{opacity:1}
#library.fadein{animation:libin 1s ease-out both}
@keyframes libin{from{opacity:0;filter:blur(10px) brightness(.4);transform:scale(1.04)}to{opacity:1;filter:none;transform:none}}
#signin{position:relative;min-height:100%;background:#0E0606;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;padding:24px 0 32px}
.scene{position:relative;flex-shrink:0;width:clamp(520px,min(100vw,calc((100vh - 200px) * 1.7917)),1376px);aspect-ratio:1376/768;container-type:inline-size;overflow:hidden;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}

.scene>*{position:absolute}
.bgimg{inset:0}
.bgimg img{width:100%;height:100%;display:block}
.title img{width:100%;display:block}
.dim{inset:0;background:radial-gradient(ellipse 30% 40% at 49.5% 56%,rgba(8,3,3,.55),rgba(5,2,2,.93));transition:opacity 2.2s ease}
.lit .dim{opacity:0}
.tvlight{left:22%;top:22%;width:56%;height:70%;background:radial-gradient(closest-side,rgba(255,196,110,.30),rgba(255,160,80,.08) 60%,transparent);mix-blend-mode:screen;opacity:0;pointer-events:none}
.neon-on .tvlight{opacity:1;animation:buzz 5s infinite}
.title{left:24.71%;top:12.37%;width:51.6%;clip-path:inset(0 100% 0 0);filter:drop-shadow(0 0 0 rgba(255,190,110,0))}
.lit .title{transition:clip-path 1.9s cubic-bezier(.6,.05,.3,1) .5s,filter 1.2s ease 2.2s;clip-path:inset(0 0 0 0);filter:drop-shadow(0 0 1.4cqw rgba(255,190,110,.45))}
.tv{left:38.15%;top:40.23%;width:21.95%;height:30.99%;background:#040404;border-radius:9%/12%;overflow:hidden;container-type:inline-size;display:flex;align-items:center;justify-content:center}
.tv::before{content:"";position:absolute;inset:0;background:#fff;transform:scale(0,.004);opacity:0;z-index:3}
.tv.boot::before{animation:crt .55s ease-out forwards}
.tv canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s}
.tv.static canvas{opacity:.85}
.neon{position:relative;z-index:2;font-family:'Tilt Neon',sans-serif;direction:ltr;text-align:center;font-size:23cqw;line-height:1.02;color:#FFD98C;opacity:0;text-shadow:0 0 1cqw #fff3c4,0 0 3cqw #ffbf55,0 0 7cqw #ff9d2e,0 0 14cqw #ff8a1e}
.neon-on .neon{animation:flick 1.6s steps(1) forwards,buzz 5s 1.6s infinite}
.tv::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(rgba(255,255,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.65))}
.power{position:relative;z-index:5;background:none;border:0;color:#CDBBA9;font-family:var(--font);font-size:max(12px,7.5cqw);display:flex;flex-direction:column;align-items:center;gap:4cqw;min-height:44px;padding:8px;animation:breathe 2.4s ease-in-out infinite}
.power svg{width:max(22px,17cqw);height:max(22px,17cqw)}
.started .power{display:none}
.chip{position:absolute;top:16px;z-index:6;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(10,4,4,.55);color:#EADCCB;font-family:var(--font);font-size:13px;display:none;align-items:center;gap:6px;backdrop-filter:blur(4px)}
#signin.started .chip{display:inline-flex}
#btnSkip{left:16px}
#signin.done #btnSkip{display:none}
.login{width:min(440px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;margin-top:4px;opacity:0;transform:translateY(14px);visibility:hidden;transition:opacity .9s ease,transform .9s ease,visibility 0s .9s}
.done .login,#signin.done .login{opacity:1;transform:none;visibility:visible;transition:opacity .9s ease,transform .9s ease}
.login h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.login .lead{margin:0;text-align:center;font-size:16px;color:var(--text)}
.login .note{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.btn.google{min-height:52px;font-size:16px}
@keyframes crt{0%{opacity:1;transform:scale(0,.004)}35%{opacity:1;transform:scale(1,.004)}70%{opacity:.9;transform:scale(1,1)}100%{opacity:0;transform:scale(1,1)}}
@keyframes flick{0%{opacity:0}8%{opacity:1}12%{opacity:.1}20%{opacity:.9}24%{opacity:.2}38%{opacity:1}42%{opacity:.35}50%,100%{opacity:1}}
@keyframes buzz{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.82}49%{opacity:1}86%{opacity:.93}87%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.winsnow,.fireglow,.firecv,.steamcv{display:none;pointer-events:none}
@keyframes fireglow{0%{opacity:.14}12%{opacity:.26}20%{opacity:.15}35%{opacity:.3}48%{opacity:.18}60%{opacity:.32}72%{opacity:.16}85%{opacity:.27}100%{opacity:.14}}
@media (prefers-reduced-motion:reduce){.fireglow{animation:none!important}.neon-on .neon{animation:none;opacity:1}.neon-on .tvlight{animation:none}.power{animation:none;opacity:1}.lit .title{transition:clip-path .01s,filter .01s}}

/* الجوال بالطول: صورة طولية بمواضع خاصة، والريموت يبقى فوق الشاشة */
@media (max-aspect-ratio:1/1){
  #signin{justify-content:flex-start;padding-top:0}
  .scene{width:min(100vw,calc(100vh * .5581));width:min(100vw,calc(100svh * .5581));aspect-ratio:768/1376;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
  .title{left:18.23%;top:31.98%;width:65.1%}
  #signin.wint .title{left:19.01%;top:34.08%;width:63.02%}
  /* ثلج يتساقط داخل الشباك */
  #signin.wint .winsnow{display:block;left:5.99%;top:16.79%;width:40.1%;height:23.69%;-webkit-mask:url(assets/win-mask.png) 0 0/100% 100% no-repeat;mask:url(assets/win-mask.png) 0 0/100% 100% no-repeat}
  /* النار: وهج يرتجف ولهب يتمايل */
  #signin.wint .fireglow,#signin.wint .firecv{display:block;left:67.71%;top:39.24%;width:32.29%;height:21.8%;-webkit-mask:url(assets/fire-mask.png) 0 0/100% 100% no-repeat;mask:url(assets/fire-mask.png) 0 0/100% 100% no-repeat}
  #signin.wint .fireglow{background:radial-gradient(ellipse at 72% 62%,#ffb347,#ff7a1a 40%,rgba(255,77,0,0) 75%);mix-blend-mode:screen;opacity:.18;animation:fireglow 2.3s infinite}
  #signin.wint .firecv{mix-blend-mode:screen}
  /* بخار القدر والكوب وفقاعات الشوربة */
  #signin.wint .steamcv{display:block;left:61.2%;top:43.6%;width:38.8%;height:14.53%}
  .tv{left:35.29%;top:46.29%;width:27.34%;height:11.99%;border-radius:6%/9%;clip-path:polygon(0 0,100% 0,100% 100%,99.4% 100%,98.4% 94%,97% 89.5%,94.8% 87.4%,92% 86.6%,20% 86.4%,17.6% 87.2%,16.1% 89%,15.4% 92%,15.2% 100%,0 100%)}
  .neon{font-size:21cqw;margin-top:-6%}
  .tvlight{left:8%;top:34%;width:84%;height:34%}
  #signin{--sw:min(100vw,calc(100vh * .5581));--sw:min(100vw,calc(100svh * .5581));padding-bottom:0}
  /* المقاسات تتبع عرض المشهد، فتبقى متناسبة حتى لو فتح المتصفح بوضع سطح المكتب */
  .login{position:absolute;z-index:6;left:0;right:0;margin:0 auto;width:calc(var(--sw) * .88);top:calc(var(--sw) * 1.7917 * .045);font-size:max(15px,calc(var(--sw) * .04));gap:.8em;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .login .lead{font-size:1em;line-height:1.55}
  .login .note{font-size:.8em}
  .login .btn{font-size:1em;min-height:3.3em;border-radius:.8em}
  .login .msg{font-size:.9em}
  #signin .chip{font-size:max(13px,calc(var(--sw) * .034));min-height:max(44px,calc(var(--sw) * .11));padding:0 1.1em;border-radius:2em}
}

body.forcep #signin{background:#0E0606}
body.forcep #signin::before{content:"";position:fixed;inset:-40px;background:url(assets/scene-winter-p.webp) center/cover no-repeat;filter:blur(28px) brightness(.45) saturate(1.2);z-index:-1;pointer-events:none}
body.forcep #signin{isolation:isolate}

/* الشاشات العريضة (كمبيوتر وتلفزيون وتابلت بالعرض): مشهد الكوخ مكبّر يملأ الشاشة كلها، والتلفزيون في النص، والدخول تحت فوق المشهد */
body.forcep:not(.wsplit) #signin{display:block;position:relative;height:100vh;height:100svh;min-height:0;padding:0;overflow:hidden}

body.forcep:not(.wsplit) #signin .login .note,body.forcep:not(.wsplit) #signin .login .msg,body.forcep:not(.wsplit) #signin .login details{grid-column:1 / -1;text-align:center}

/* الأزرار والنماذج */
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--text);padding:0 18px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.small{min-height:44px;font-size:14px}
.msg{font-size:14px;color:var(--warn);background:#2A1F1C;border:1px solid #4A322C;border-radius:10px;padding:10px 12px}
details{border-top:1px solid var(--line);padding-top:12px}
.brand{display:inline-flex;align-items:center}
/* الساعة والتاريخ */
.clock{display:flex;flex-direction:column;line-height:1.25;min-width:0;margin-inline-start:auto;text-align:end}
.clock b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--text)}
.clock span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock .clknext{color:var(--accent)}
/* تذكير الصلاة */
.prayer{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:2147483647;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100vw - 24px);background:var(--raised);border:1px solid var(--accent);border-radius:18px;padding:12px 18px;box-shadow:0 18px 40px rgba(0,0,0,.6);transform:translate(-50%,160%);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s ease}
.prayer.up{transform:translate(-50%,0);opacity:1}
.prayer[hidden]{display:none}
.pricon{font-size:28px;line-height:1}
.prtext{display:flex;flex-direction:column}
.prtext b{font-size:18px}
.prtext span{color:var(--accent);font-size:14px;font-weight:600}
.prtimes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.prtimes div{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--muted)}
.prtimes div b{display:block;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.prtimes div.next{border-color:var(--accent)}
.prtimes div.next b{color:var(--accent)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{position:relative;width:52px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--ground);cursor:pointer;flex:none}

.setsel{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ground);color:var(--text);font:inherit;padding:0 12px}
.top h1 .brand{font-family:var(--script);font-weight:400;font-size:24px;color:var(--accent);line-height:1}
summary{cursor:pointer;font-size:14px;color:var(--muted);min-height:32px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}

/* المكتبة */
header.top{position:sticky;top:0;background:var(--ground);border-bottom:1px solid var(--line);z-index:5;transform:translateZ(0)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}

.search{flex:1 1 220px;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 18px}
.search::placeholder{color:var(--muted)}
.who{font-size:12px;color:var(--muted);direction:ltr;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;color:var(--on-accent);background:var(--accent);border-radius:20px;padding:2px 10px;font-weight:700}
.status{font-size:13px;color:var(--muted);padding:10px 0 0}
main{padding-bottom:48px;position:relative;z-index:2}
/* أجواء الشتاء: ثلج أو مطر خلف المحتوى، ما يغطي الأغلفة ولا يمنع اللمس */
#wx{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;pointer-events:none;z-index:1;display:none;transform:translateZ(0);will-change:transform}
body.wx-on #wx{display:block}
body.playing #wx{display:none}
.wxbtn{flex:none}
.wxwrap{position:relative;flex:none}
/* القائمة تفتح لداخل الشاشة (يمين الزر = يمين القائمة) عشان ما تنقص */
.wxmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;display:flex;flex-direction:column;gap:6px;width:150px;max-width:calc(100vw - 24px);padding:8px;background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.wxmenu[hidden]{display:none}
.wxmenu button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:15px;cursor:pointer;text-align:center}
.wxmenu button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
/* الإعدادات */
.sethead{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
.sethead h2{margin:0;font-size:24px;flex:1}
.setdone{display:block;width:100%;max-width:420px;margin:18px auto 8px;min-height:50px;font-size:17px}
.setsec{background:var(--raised);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:10px}
.setsec h3{margin:0 0 14px;font-size:18px}
.setlabel{color:var(--muted);font-size:14px;margin:14px 0 8px}
.setbgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setbg{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--text);font:inherit;cursor:pointer;text-align:center}
.setbg[aria-checked="true"]{border-color:var(--accent)}
.setthumb{display:block;aspect-ratio:3/4;border-radius:10px;background:var(--ground) center 30%/cover no-repeat;border:1px solid var(--line)}
.setname{font-size:14px;font-weight:600}
.setaccents{display:flex;flex-wrap:wrap;gap:8px}
.setacc{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.setacc[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.setdot{width:18px;height:18px;border-radius:50%;flex:none}
.adov{position:absolute;inset:0;z-index:8;background:#000;display:flex;align-items:center;justify-content:center}
.adov video{width:100%;height:100%;object-fit:contain;background:#000}
.adtag{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 10px;font-size:13px}
.adskip{position:absolute;bottom:22px;left:16px;background:rgba(0,0,0,.7)!important;color:#fff!important;border:1px solid rgba(255,255,255,.4)!important}
.adsnd{position:absolute;bottom:22px;right:16px}
.adfull{position:fixed;inset:0;z-index:80;background:#000;animation:adin .5s ease}
@keyframes adin{from{opacity:0}to{opacity:1}}
.adclose{position:absolute;top:12px;left:12px;z-index:9;color:#fff;background:rgba(0,0,0,.5)}
.sheetbg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(520px,100%);max-height:85vh;overflow:auto;background:var(--raised);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetup .3s ease}
@media (min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:20px}}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheethd{display:flex;align-items:center;gap:8px}
.sheethd h3{flex:1;margin:0;font-size:18px}
.sheetbody{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-size:16px;cursor:pointer;text-align:start}
.lrow[aria-checked="true"]{border-color:var(--accent)}
.lbox{width:24px;height:24px;border-radius:6px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on-accent)}
.lrow[aria-checked="true"] .lbox{background:var(--accent);border-color:var(--accent)}
.lname{flex:1}
.lcount{color:var(--muted);font-size:13px;flex:none}
.lnew{display:flex;gap:8px;margin-top:6px}
.lnew input{flex:1;min-width:0}
.lrename{flex:1;min-width:0}
.setnote{color:var(--muted);font-size:13px;margin:16px 0 0}
/* الخلفية الشتوية خلف المكتبة، معتّمة عشان المحتوى يبقى واضح */
#wxbg{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:0;display:none;transform:translateZ(0);background:linear-gradient(rgba(17,12,11,.62),rgba(17,12,11,.8) 55%,rgba(17,12,11,.9)),url('assets/winter-bg.webp') center 30%/cover no-repeat}
body.wxbg-on #wxbg{display:block}
body.playing #wxbg{display:none}
body.wxbg-on header.top{background:rgba(17,12,11,.96)}
.wxbtn.on{color:var(--accent)}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
.rowhead h2{margin:0;font-size:18px;font-weight:700}
.rowhead button{background:none;border:0;color:var(--muted);min-height:44px;font-size:14px;text-decoration:underline}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.card{flex:0 0 132px;width:132px;scroll-snap-align:start;background:none;border:0;color:var(--text);padding:0;display:flex;flex-direction:column;gap:6px;text-align:right}
.tile{width:132px;height:190px;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow:hidden;display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .tile,.card:focus-visible .tile{border-color:var(--accent)}
.card .name{font-size:14px;font-weight:500;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:10px 0 0;font-size:14px;color:var(--muted)}
.crumbs button{background:none;border:0;color:var(--muted);min-height:44px;padding:0 6px;text-decoration:underline}
.crumbs .here{color:var(--text);font-weight:700;padding:0 6px}
h3{font-size:15px;margin:18px 0 10px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px 12px}
.folder{min-height:96px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:right;gap:10px}
.folder:hover,.video:hover{background:var(--raised)}
.folder span{font-weight:500;overflow-wrap:anywhere}
.folder svg{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.video{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:right;width:100%}
.video .play{width:40px;height:40px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vthumb{position:relative;width:96px;height:54px;border-radius:8px;background:var(--raised);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play.mini{position:relative;width:28px;height:28px;border-radius:14px}
.video .txt{flex:1;display:flex;flex-direction:column;min-width:0}
.video .name{overflow-wrap:anywhere;font-weight:500}
.video .where{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.video .dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.state{color:var(--muted);padding:28px 0;text-align:center}

/* المشغّل */
#player{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:100vw;overflow:hidden;background:#000;z-index:20;display:flex;flex-direction:column}
#player .stage{min-width:0;min-height:0;overflow:hidden}
#player video,#player iframe{max-width:100%}
.pbar,.pctl,.pstrip{min-width:0;max-width:100%;box-sizing:border-box}
.pbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ground);border-bottom:1px solid var(--line)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{background:var(--raised)}
#pFav[aria-pressed="true"]{color:var(--accent)}
.pbar .ptitle{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700;line-height:1.35}
.pbar .ptitle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pseries{font-size:12px;color:var(--accent);font-weight:500}
/* زر العودة لواجهة المسلسل */
.pback{display:flex;padding:8px 12px;background:var(--ground);border-bottom:1px solid var(--line)}
.pback:has(#pBack[hidden]){display:none}
#pBack{width:100%;justify-content:center;gap:8px;font-weight:600;color:var(--accent)}
#pBack[hidden]{display:none}
@media (max-height:520px){.pback{display:none}}
button.pseries{all:unset;cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px;max-width:100%;min-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
button.pseries:focus-visible{outline:2px solid var(--accent);border-radius:4px}
button.pseries[hidden]{display:none}
.pseries:empty{display:none}
.pbar a{color:var(--muted);font-size:13px;min-height:44px;display:inline-flex;align-items:center;padding:0 6px;white-space:nowrap}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:#000}
.stage iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
.stage .demo{color:var(--muted);text-align:center;padding:24px;max-width:420px}
.pctl{display:flex;gap:8px;justify-content:center;padding:10px 12px;background:var(--ground);border-top:1px solid var(--line)}
.pctl .btn{flex:0 1 auto}
.pctl .primary{flex:1 1 auto;max-width:280px}
.pstrip{display:flex;gap:10px;overflow-x:auto;padding:0 12px 12px;background:var(--ground);scroll-snap-type:x proximity}
.pep{flex:0 0 132px;display:flex;flex-direction:column;gap:6px;background:none;border:0;color:var(--muted);padding:0;text-align:right;scroll-snap-align:start}
.pep .vthumb{width:132px;height:74px;border:2px solid transparent}
.pep[aria-current] .vthumb{border-color:var(--accent)}
.pep[aria-current]{color:var(--text)}
.pseason{flex:0 0 auto;align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;color:var(--accent);padding:0 2px;border-inline-start:1px solid var(--line)}
.pepname{font-size:12px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seenmark{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
@media (max-height:520px){.pstrip{display:none}.pctl{padding:6px 12px}}

/* شريط القنوات */
.chanhead{font-size:20px;margin:18px 0 10px}
.channels{direction:ltr;overflow-x:auto;padding:4px 0 8px;margin:0 -20px;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:16px;width:max-content;padding:0 20px;direction:ltr}
.track .chan{direction:rtl}
.channels{overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.channels.dragging{cursor:grabbing}
.track{will-change:transform}
.chan img{-webkit-user-drag:none;pointer-events:none}
.chan{flex:0 0 160px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--text)}
.chanlogo{width:160px;height:100px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}

.chanlogo img{width:100%;height:100%;object-fit:cover;display:block}
.chan:hover .chanlogo,.chan:focus-visible .chanlogo{outline:2px solid var(--accent);outline-offset:2px}
.chaninit{font-size:44px;font-weight:700;color:var(--accent)}
.channame{font-size:15px;font-weight:600;text-align:center;line-height:1.35;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المشغّل: الاستكمال */
.stage{position:relative}
.rotbtn{position:absolute;top:10px;right:10px;z-index:6;width:48px;height:48px;border-radius:24px;border:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .4s ease}
.rotbtn.idle{opacity:0;pointer-events:none}
.focusbtn{right:66px}
/* ===== حركة التحديث الكرتونية ===== */
.rfx{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:19;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;opacity:0;transform:translateY(20px) scale(.6);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.rfx.on{opacity:1;transform:none}
.rfxa{display:grid;place-items:center;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffaf0,#f1dfc2);border:3px solid #1a120c;box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 -5px 0 rgba(0,0,0,.08)}
.rfxa svg{width:94px;height:94px;overflow:visible}
.rfxopt .rfxa{width:56px;height:56px;border-width:2.5px;box-shadow:none}.rfxopt .rfxa svg{width:42px;height:42px}.rfxopt .rfxa .ok{display:none}
.rfxa.none{background:transparent;border-style:dashed;border-color:var(--line)}
.rfx .rfxtag{font-size:14px;font-weight:700;background:var(--raised);color:var(--text);border:2px solid #1a120c;border-radius:999px;padding:2px 10px;white-space:nowrap}
.rfxa .ol{stroke:#1a120c;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.rfxa .lvl{transform-box:fill-box;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.rfxa .wave{animation:rfxWave 1.6s linear infinite}
.rfxa .bub{animation:rfxBub 1.8s ease-in infinite;opacity:0}
.rfxa .bub:nth-of-type(2){animation-delay:.6s}.rfxa .bub:nth-of-type(3){animation-delay:1.2s}
.rfxa .flame{transform-box:fill-box;transform-origin:50% 100%;animation:rfxFlick .35s ease-in-out infinite alternate}
.rfxa .wob{transform-box:fill-box;transform-origin:50% 100%;animation:rfxWob 1.4s ease-in-out infinite}
.rfxa .drip{animation:rfxDrip 1.5s ease-in infinite}.rfxa .drip+.drip{animation-delay:.75s}
.rfxa .eye{transform-box:fill-box;transform-origin:center;animation:rfxBlink 3.2s infinite}
.rfx.done .rfxa{animation:rfxJoy .7s cubic-bezier(.3,1.8,.5,1)}
.rfxa .ok{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.rfx.done .rfxa .ok{opacity:1;transform:scale(1)}
@keyframes rfxWave{from{transform:translateX(0)}to{transform:translateX(-24px)}}
@keyframes rfxBub{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-26px)}}
@keyframes rfxFlick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.85,1.15) rotate(4deg)}}
@keyframes rfxWob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes rfxDrip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes rfxBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes rfxJoy{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-8deg)}70%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.rfxa,.rfxa *{animation:none!important}}
.rfxopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rfxopt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;min-height:44px}
.rfxopt[aria-checked="true"]{border-color:var(--accent)}
.tapseek{position:absolute;top:50%;transform:translateY(-50%);z-index:7;pointer-events:none;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:16px;padding:10px 16px;border-radius:999px;direction:rtl}
.tapseek.fwd{right:8%}.tapseek.back{left:8%}
.dubwrap{position:absolute;top:10px;right:122px;z-index:7}
.dubbtn{position:static;width:auto;gap:6px;padding:0 10px 0 12px;font:inherit;font-size:15px;font-weight:700}
.dublbl{white-space:nowrap}
.dubmenu{position:absolute;top:56px;right:0;min-width:170px;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.dubmenu[hidden]{display:none}
.dubmenu button{min-height:42px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text);font:inherit;font-size:15px;text-align:start;padding:0 12px;cursor:pointer}
.dubmenu .dubswap{border-top:1px solid var(--line)!important;border-radius:0 0 8px 8px;font-size:13px!important;color:var(--muted)!important;margin-top:2px}
.dubmenu button[aria-checked="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
#player.focus .pbar,#player.focus .pback,#player.focus .pctl,#player.focus .pstrip{display:none}
.rotbtn:focus-visible{outline:2px solid var(--accent);opacity:1}
.stage:fullscreen{background:#000}
.stage video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.resume{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(10,6,6,.82);text-align:center}
.rtitle{margin:0;font-size:18px;font-weight:700}
.rsub{margin:0;color:var(--muted);font-size:14px}

.audnote{display:flex;flex-wrap:wrap;align-items:center;gap:8px;pointer-events:auto}

.pnote{position:absolute;top:10px;left:10px;right:10px;z-index:3;background:rgba(18,10,10,.9);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;max-width:min(520px,calc(100% - 32px));background:var(--text);color:var(--ground);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#pDl.on{color:var(--accent)}
.dlpct{font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.dlrow{display:flex;align-items:center;gap:6px}
.epdl{flex:none;width:44px;height:44px}
.iconbtn.arm,.btn.arm{color:#ff8a7a}
.dlall{flex-wrap:wrap;gap:8px}
.dlch{display:flex;align-items:center;gap:12px;margin:22px 0 4px}

.dlch h3{margin:0;font-size:17px}

.dllogo .chaninit{font-size:20px}
.row .tile{position:relative}
.dlbadge{position:absolute;top:6px;left:6px;z-index:2;display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;padding:3px 7px;border-radius:10px}
.tile .chaninit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}
.dlhead{display:flex;align-items:center;gap:12px;margin:18px 0 8px}
.dlhead img{width:48px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.dlhead.link{cursor:pointer;border-radius:12px;padding:4px}
.dlhead.link>div{flex:1}
.dlgo{font-size:24px;color:var(--muted);padding:0 8px}
.dlt{font-size:17px;font-weight:600;color:var(--text)}
.dlc{font-size:13px;color:var(--muted);margin-top:2px}
.epdl.on{color:var(--accent)}
.dlall{display:flex;justify-content:flex-start;margin:4px 0 10px}
.dlall .btn{display:inline-flex;align-items:center;gap:8px}
.dlrow .video{flex:1;min-width:0}
.dlinfo{margin:0 0 6px;color:var(--muted);font-size:13px}
.dlbar{display:block;width:100%;margin-top:6px}
.dlbar i{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--accent)}

/* يوتيوب */
.creators{gap:14px}
.creator{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--text)}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--raised);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}

.avatar.big{width:72px;height:72px;flex-shrink:0}
.creator:hover .avatar,.creator:focus-visible .avatar{border-color:var(--accent)}
.cname{font-size:13px;font-weight:600;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ythead{display:flex;align-items:center;gap:14px;margin-top:10px}
.ythead .ptitle2{margin:0}
.cologo.big{width:72px;height:72px}
.vcard{flex:0 0 220px;width:220px;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;color:var(--text);text-align:right}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px 14px}

.state.small{padding:8px 0 16px;text-align:right;font-size:14px}

.ptitle2{font-size:22px;margin:16px 0 4px}

.cologo{width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--raised);border:1px solid var(--line);flex-shrink:0}

.tile{position:relative}

.tacts .btn{gap:8px}

.seasons{padding-top:18px}

.video.watched .name{color:var(--muted)}
.video.current{border-color:var(--accent)}
